name: Publish container images

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: empiria

jobs:
  # --- Legacy images (D-10 backward compat) ---

  legacy-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for mnemosyne-base
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/mnemosyne-base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push mnemosyne-base
        uses: docker/build-push-action@v6
        with:
          context: containers/base
          file: containers/base/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MNEMOSYNE_BUILD_HASH=${{ github.sha }}
          cache-from: type=gha,scope=mnemosyne-base
          cache-to: type=gha,mode=max,scope=mnemosyne-base

  legacy-claude:
    needs: legacy-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for mnemosyne-claude
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/mnemosyne-claude
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push mnemosyne-claude
        uses: docker/build-push-action@v6
        with:
          context: containers/claude
          file: containers/claude/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MNEMOSYNE_BUILD_HASH=${{ github.sha }}
            BASE_IMAGE=ghcr.io/${{ env.ORG }}/mnemosyne-base:latest
          cache-from: type=gha,scope=mnemosyne-claude
          cache-to: type=gha,mode=max,scope=mnemosyne-claude

  # --- SCION capability images ---
  # SCION base images (scion-claude etc.) are pre-built in ghcr.io/empiria/.
  # To rebuild them, trigger the build-images workflow on the Empiria fork:
  #   gh workflow run build-images.yml --repo Empiria/scion \
  #     -f registry=ghcr.io/empiria -f target=common -f tag=latest -f platform=all

  empiria-claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for empiria-claude
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/empiria-claude
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push empiria-claude
        uses: docker/build-push-action@v6
        with:
          context: containers/empiria-claude
          file: containers/empiria-claude/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/scion-claude:latest
            MNEMOSYNE_REV=${{ github.sha }}
          cache-from: type=gha,scope=empiria-claude
          cache-to: type=gha,mode=max,scope=empiria-claude

      - name: Assert empiria-claude image size < 4 GiB (SBR-3.2 acceptance)
        run: |
          # Phase 33.3 SBR-3.2 D-10: acceptance bar is < 4 GiB for empiria-claude.
          # Tier-1 cleanup (Plan 01) lands first; tier-2 multi-stage (Plan 05) makes
          # the bar achievable. If this fails after Plan 05, Plan 05's checkpoint
          # surfaces soft 5 GiB fallback per RESEARCH Open Question 3.
          IMAGE_REF="${REGISTRY}/${ORG}/empiria-claude:latest"
          docker pull "$IMAGE_REF"
          IMAGE_SIZE_BYTES=$(docker image inspect "$IMAGE_REF" --format '{{.Size}}')
          IMAGE_SIZE_GIB=$(awk "BEGIN { printf \"%.2f\", $IMAGE_SIZE_BYTES / 1073741824 }")
          echo "empiria-claude size: ${IMAGE_SIZE_BYTES} bytes (${IMAGE_SIZE_GIB} GiB)"
          # Hard target: 4 GiB = 4 * 1024^3 = 4294967296 bytes
          if [ "$IMAGE_SIZE_BYTES" -ge 4294967296 ]; then
            echo "::error::empiria-claude image size ${IMAGE_SIZE_GIB} GiB exceeds 4 GiB acceptance bar (SBR-3.2 D-10)"
            # Soft fail until Plan 05 lands — continue-on-error: true on the
            # step until then. Plan 05 task 05.X will REMOVE continue-on-error
            # to make this assertion fail the workflow.
            exit 1
          fi
          echo "::notice::empiria-claude size ${IMAGE_SIZE_GIB} GiB under 4 GiB target"
        continue-on-error: true

  empiria-claude-anvil:
    needs: empiria-claude
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for empiria-claude-anvil
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/empiria-claude-anvil
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push empiria-claude-anvil
        uses: docker/build-push-action@v6
        with:
          context: containers/empiria-claude-anvil
          file: containers/empiria-claude-anvil/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.ORG }}/empiria-claude:latest
          cache-from: type=gha,scope=empiria-claude-anvil
          cache-to: type=gha,mode=max,scope=empiria-claude-anvil
